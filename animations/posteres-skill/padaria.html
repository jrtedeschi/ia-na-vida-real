<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Padaria Estrela — pôster</title>
<!-- Direção dealt pela tasteskill: "The place carries it" (seed 389557214), herói "Navigation on the midline",
     tipo Clash Grotesk. Paleta: as proporções de "Three stones" (a cor vive na foto, uma faixa só), com as cores
     tiradas do próprio assunto: o breu da padaria antes de abrir, o vermelho do letreiro, o dourado da casca.
     Ideia: às 6h, 11h e 17h a rua inteira sente o cheiro; o horário da fornada vira o título do pôster.
     Foto gerada por IA (Higgsfield, modelo Soul 2.0): o padeiro tirando a fornada das 6h. -->
<link href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@400,500,600&display=swap" rel="stylesheet">
<style>
	:root {
		--night: #0d0907;
		--sign: #cf3a20;
		--sign-ink: #fff1df;
		--ink: #fff1df;
		--crust: #f4b860;
		--muted: #b9a58f;
		--font: 'Clash Grotesk', sans-serif;
		--margin: 56px;
	}
	* { box-sizing: border-box; margin: 0; }
	html, body { width: 1080px; height: 1350px; overflow: hidden; }
	body { background: var(--night); color: var(--ink); font-family: var(--font); position: relative; }

	.photo {
		position: absolute; inset: 0 0 auto 0;
		width: 1080px; height: 1440px;
		object-fit: cover; object-position: 50% 0;
		display: block;
	}

	/* A faixa no meio: o letreiro da padaria atravessando a foto na altura do balcão */
	.rail {
		position: absolute; left: 0; right: 0; top: 770px;
		height: 96px;
		background: var(--sign); color: var(--sign-ink);
		display: flex; align-items: center; justify-content: space-between;
		padding: 0 var(--margin);
	}
	h1 { font: 600 70px/1 var(--font); letter-spacing: -0.02em; }
	.rail p { font: 500 34px/1 var(--font); letter-spacing: -0.005em; }

	.below {
		position: absolute; left: var(--margin); right: var(--margin); top: 906px;
	}
	.claim { font: 500 62px/1 var(--font); letter-spacing: -0.03em; max-width: 19ch; }
	.times {
		margin-top: 18px;
		display: flex; justify-content: space-between; align-items: baseline;
		font: 600 228px/0.82 var(--font); letter-spacing: -0.05em;
		color: var(--crust);
	}
	.times span small { font-size: 0.5em; letter-spacing: -0.03em; }
	.foot {
		position: absolute; left: var(--margin); right: var(--margin); bottom: 34px;
		display: flex; justify-content: space-between; align-items: baseline;
		font: 500 30px/1.1 var(--font);
	}
	.credit { position: absolute; right: var(--margin); top: 24px; font: 400 15px/1 var(--font); color: rgba(255, 241, 223, 0.75); }
</style>
</head>
<body>
	<img class="photo" src="assets/gerada-padeiro-6h.jpg" width="1536" height="2048" alt="Padeiro sorridente tirando do forno, de madrugada, uma assadeira de pães franceses fumegantes">
	<header class="rail">
		<h1>Padaria Estrela</h1>
		<p>Rua da Mooca, 1.240</p>
	</header>
	<main class="below">
		<p class="claim">A Mooca sabe a hora pelo cheiro do pão.</p>
		<p class="times" aria-label="Fornadas às 6h, 11h e 17h"><span>6<small>h</small></span><span>11<small>h</small></span><span>17<small>h</small></span></p>
	</main>
	<footer class="foot">
		<span>Pão francês saindo do forno</span>
		<span>Encomendas (11) 98765-4321</span>
	</footer>
	<p class="credit">Foto gerada por IA (Higgsfield)</p>
</body>
</html>
