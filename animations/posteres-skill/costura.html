<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ateliê da Cida — pôster</title>
<!-- Direção dealt pela tasteskill: "The split stage" (seed 1214657600), herói "Striped card beside the room",
     tipo Imbue / Albert Sans, paleta Sand and moss. A "listra do assunto" que o herói pede é a fita métrica
     amarela da Cida. Ideia: a frase que o bairro inteiro diz, "deixa com a Cida", vira o letreiro; a fita
     métrica vira a faixa do cartão. Foto gerada por IA (Higgsfield, modelo Soul 2.0). -->
<link href="https://fonts.googleapis.com/css2?family=Imbue:opsz,wght@10..100,400;10..100,500&family=Albert+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
	:root {
		--ground: #3f5a2a;
		--paper: #e6dece;
		--ink: #26251f;
		--muted: #59574e;
		--accent: #3f5a2a;
		--accent-ink: #ffffff;
		--tape: #f1c52e;
		--display: 'Imbue', serif;
		--text: 'Albert Sans', sans-serif;
		--edge: 16px;
	}
	* { box-sizing: border-box; margin: 0; }
	html, body { width: 1080px; height: 1350px; overflow: hidden; }
	body {
		background: var(--ground); color: var(--ink); font-family: var(--text);
		display: grid; grid-template-columns: 1fr 1fr; gap: var(--edge); padding: var(--edge);
	}
	.card { background: var(--paper); position: relative; display: flex; flex-direction: column; }
	.tape { display: block; width: 100%; height: 76px; }
	.inner { padding: 44px 40px 40px; display: flex; flex-direction: column; flex: 1; }
	.name { font: 600 34px/1 var(--text); letter-spacing: -0.01em; }
	h1 {
		margin-top: 40px;
		font: 400 152px/0.86 var(--display); font-variation-settings: 'opsz' 100;
		letter-spacing: -0.01em; text-transform: uppercase;
	}
	.lead { margin-top: auto; font: 600 54px/1.04 var(--text); letter-spacing: -0.025em; max-width: 11ch; }
	.body { margin-top: 22px; font: 400 32px/1.3 var(--text); }
	.prices { margin-top: auto; list-style: none; padding: 0; font: 500 40px/1.42 var(--text); font-variant-numeric: tabular-nums; }
	.prices li { display: flex; justify-content: space-between; }
	.call {
		margin-top: 28px; background: var(--accent); color: var(--accent-ink);
		padding: 22px 24px; font: 600 46px/1 var(--text); letter-spacing: -0.01em;
	}
	.addr { margin-top: 18px; font: 400 27px/1.3 var(--text); color: var(--muted); }
	.room { position: relative; overflow: hidden; }
	.room img { width: 100%; height: 100%; object-fit: cover; object-position: 54% 50%; display: block; }
	.credit { position: absolute; right: 18px; bottom: 16px; font: 400 15px/1 var(--text); color: rgba(255, 255, 255, 0.8); }
</style>
</head>
<body>
	<main class="card">
		<svg class="tape" viewBox="0 0 516 76" preserveAspectRatio="none" aria-hidden="true">
			<rect width="516" height="76" fill="#f1c52e"/>
			<g id="ticks" fill="#26251f"></g>
		</svg>
		<div class="inner">
			<p class="name">Ateliê da Cida</p>
			<h1>Deixa com a Cida.</h1>
			<p class="lead">Barra pronta no mesmo dia.</p>
			<p class="body">Deixe a calça de manhã e busque às 18h. A Cida já sabe a sua medida.</p>
			<ul class="prices">
				<li><span>Barra</span><span>R$ 25</span></li>
				<li><span>Zíper</span><span>R$ 30</span></li>
				<li><span>Cintura</span><span>R$ 40</span></li>
			</ul>
			<p class="call">(11) 98765-4321</p>
			<p class="addr">Rua Tuiuti, 88, perto da feira</p>
		</div>
	</main>
	<figure class="room">
		<img src="assets/gerada-dona-cida.jpg" width="1152" height="2048" alt="Costureira de uns sessenta anos, de óculos, com fita métrica amarela no pescoço e alfinetes na boca, sentada num banquinho com uma calça jeans no colo e um sorriso maroto">
		<figcaption class="credit">Foto gerada por IA (Higgsfield)</figcaption>
	</figure>
	<script>
		// Os riscos da fita métrica: um a cada milímetro-de-pôster, meio centímetro mais alto, centímetro com número.
		const g = document.getElementById('ticks');
		const ns = 'http://www.w3.org/2000/svg';
		const step = 8.6;
		for (let i = 0, x = 6; x < 516; i++, x += step) {
			const h = i % 10 === 0 ? 34 : i % 5 === 0 ? 24 : 14;
			const r = document.createElementNS(ns, 'rect');
			r.setAttribute('x', x); r.setAttribute('y', 0); r.setAttribute('width', 2.4); r.setAttribute('height', h);
			g.appendChild(r);
			if (i % 10 === 0 && i > 0) {
				const t = document.createElementNS(ns, 'text');
				t.setAttribute('x', x + 1.2); t.setAttribute('y', 64); t.setAttribute('text-anchor', 'middle');
				t.setAttribute('font-family', 'Albert Sans, sans-serif'); t.setAttribute('font-weight', '600'); t.setAttribute('font-size', '20');
				t.textContent = 80 + i / 10;
				g.appendChild(t);
			}
		}
	</script>
</body>
</html>
